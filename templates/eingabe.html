<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4CAF50">
    <link rel="manifest" href="/manifest.json">
    <title>Zählerstand eingeben</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 18px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 10px;
        }

        button:active {
            transform: scale(0.98);
        }

        .dashboard-link {
            display: block;
            text-align: center;
            color: #667eea;
            text-decoration: none;
            margin-top: 20px;
            font-weight: 500;
        }

        .success {
            background: #4CAF50;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .success.show {
            display: block;
        }

        .info {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Energiedashboard</h1>
        <p>Zählerstände eingeben</p>

        <div id="success" class="success">
            ✓ Gespeichert!
        </div>

        <form id="eingabeForm">
            <div class="input-group">
                <label for="strom">🔌 Stromzähler (kWh)</label>
                <input type="text" id="strom" pattern="[0-9]+([.,][0-9]+)?" required inputmode="decimal" placeholder="z.B. 12345,67">
            </div>

            <div class="input-group">
                <label for="gas">🔥 Gaszähler (m³)</label>
                <input type="text" id="gas" pattern="[0-9]+([.,][0-9]+)?" required inputmode="decimal" placeholder="z.B. 6789,12">
                <div class="info">Wird automatisch in kWh umgerechnet</div>
            </div>

            <button type="submit">Speichern</button>
        </form>

        <a href="/" class="dashboard-link">📊 Zum Dashboard</a>
    </div>

    <script>
        document.getElementById('eingabeForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Komma durch Punkt ersetzen für deutsche Eingabe
            const strom = document.getElementById('strom').value.replace(',', '.');
            const gas = document.getElementById('gas').value.replace(',', '.');

            const response = await fetch('/api/speichern', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ strom, gas })
            });

            if (response.ok) {
                document.getElementById('success').classList.add('show');
                document.getElementById('eingabeForm').reset();

                setTimeout(() => {
                    document.getElementById('success').classList.remove('show');
                }, 2000);
            }
        });

        // PWA Installation
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js');
        }
    </script>
</body>
</html>
